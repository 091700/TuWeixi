# 服务器配置
server.port=8083

# 数据库配置
spring.sql.init.mode=never
spring.datasource.url=jdbc:mysql://localhost:3306/book_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Elasticsearch配置（可选，未启动时自动回退到 MySQL 搜索）
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.connection-timeout=2s
spring.elasticsearch.socket-timeout=5s
# 排除 ES 自动装配以避免启动期连接失败；项目用 try/catch + 兜底搜索
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration,org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration

# 文件上传配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# 上传文件存储路径
upload.path=uploads/

# Thymeleaf配置
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# 安全配置 (临时关闭CSRF以便测试)
spring.security.filter.order=10

spring.web.resources.static-locations=classpath:/static/,file:${upload.path}
