<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${book.title} + ' - 图书详情'">图书详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .book-image {
            max-height: 500px;
            object-fit: cover;
        }
        .price-tag {
            font-size: 2rem;
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book"></i> 智能图书平台
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-5">
                <img th:src="${book.coverImageUrl ?: '/images/default-book.jpg'}" 
                     class="img-fluid rounded book-image" alt="Book Cover">
            </div>
            <div class="col-md-7">
                <h1 th:text="${book.title}"></h1>
                <p class="text-muted lead" th:text="'作者：' + ${book.author}"></p>
                
                <div class="mb-3">
                    <span class="badge bg-success" th:if="${book.stock > 0}">
                        有货 <span th:text="${book.stock}"></span> 本
                    </span>
                    <span class="badge bg-danger" th:if="${book.stock <= 0}">缺货</span>
                </div>
                
                <div class="price-tag mb-3" th:text="'¥' + ${book.price}"></div>
                
                <div class="book-meta mb-4">
                    <p><strong>出版社：</strong> <span th:text="${book.publisher} ?: '未知'"></span></p>
                    <p><strong>ISBN：</strong> <span th:text="${book.isbn} ?: '未知'"></span></p>
                    <p><strong>浏览量：</strong> <span th:text="${book.viewCount}"></span></p>
                    <p><strong>销量：</strong> <span th:text="${book.purchaseCount}"></span></p>
                    <p><strong>上架时间：</strong> 
                        <span th:text="${#temporals.format(book.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </p>
                </div>
                
                <div th:if="${#authorization.expression('isAuthenticated()')}">
                    <form th:action="@{/orders}" method="post">
                        <input type="hidden" name="bookId" th:value="${book.id}">
                        
                        <div class="row align-items-center">
                            <div class="col-auto">
                                <label for="quantity" class="form-label">数量</label>
                            </div>
                            <div class="col-auto">
                                <input type="number" class="form-control" id="quantity" 
                                       name="quantity" value="1" min="1" th:max="${book.stock}" 
                                       style="width: 100px;">
                            </div>
                            <div class="col-auto">
                                <button type="submit" class="btn btn-primary btn-lg" 
                                        th:disabled="${book.stock <= 0}">
                                    <i class="fas fa-shopping-cart"></i> 
                                    <span th:text="${book.stock <= 0 ? '缺货' : '立即购买'}"></span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
                
                <div th:unless="${#authorization.expression('isAuthenticated()')}">
                    <a th:href="@{/login}" class="btn btn-primary btn-lg">
                        <i class="fas fa-sign-in-alt"></i> 登录后购买
                    </a>
                </div>
            </div>
        </div>
        
        <div class="row mt-5">
            <div class="col-12">
                <h3>图书简介</h3>
                <div class="card">
                    <div class="card-body">
                        <p class="card-text" th:text="${book.description} ?: '暂无简介'"></p>
                    </div>
                </div>
            </div>
        </div>
        
        <div th:if="${#authorization.expression('isAuthenticated()') && book.seller.username == #authentication.name}">
            <div class="row mt-4">
                <div class="col-12">
                    <h4>管理操作</h4>
                    <a th:href="@{'/books/edit/' + ${book.id}}" class="btn btn-warning">
                        <i class="fas fa-edit"></i> 编辑图书
                    </a>
                    <a th:href="@{'/books/delete/' + ${book.id}}" class="btn btn-danger" 
                       onclick="return confirm('确定要删除这本图书吗？')">
                        <i class="fas fa-trash"></i> 删除图书
                    </a>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
