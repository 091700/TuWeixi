<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${book.id != null ? '编辑图书' : '发布图书'}">发布图书</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
        }
        .card {
            background-color: #161b22;
            border-color: #30363d;
        }
        .card-header {
            background-color: #1f2428;
            border-bottom: 1px solid #30363d;
            color: #ffffff;
        }
        .form-label {
            color: #ffffff;
        }
        .form-control {
            background-color: #0d1117;
            border-color: #30363d;
            color: #c9d1d9;
        }
        .form-control:focus {
            background-color: #0d1117;
            border-color: #2eaadc;
            box-shadow: 0 0 0 3px rgba(46, 164, 226, 0.3);
            color: #c9d1d9;
        }
        .form-text {
            color: #8b949e;
        }
        .btn-primary {
            background-color: #2eaadc;
            border-color: #2eaadc;
        }
        .btn-primary:hover {
            background-color: #1f88c0;
            border-color: #1f88c0;
        }
        .btn-secondary {
            background-color: #30363d;
            border-color: #30363d;
        }
        .btn-secondary:hover {
            background-color: #484f58;
            border-color: #484f58;
        }
        /* 导航栏样式 */
        .navbar {
            background-color: #161b22 !important;
            border-bottom: 1px solid #30363d;
        }
        .nav-link {
            color: #c9d1d9 !important;
        }
        .nav-link:hover {
            color: #ffffff !important;
        }
        /* 页脚样式 */
        footer {
            background-color: #161b22;
            border-top: 1px solid #30363d;
        }
        /* 页面特有样式 */
        .image-preview {
            max-width: 200px;
            max-height: 300px;
            margin-top: 10px;
            border: 1px solid #30363d;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book"></i> 智能图书平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <form class="d-flex me-auto" th:action="@{/search}" method="get" style="min-width: 300px;">
                    <input class="form-control me-2" type="search" name="keyword" 
                           placeholder="搜索书名、作者..." aria-label="Search">
                    <button class="btn btn-outline-light" type="submit">
                        <i class="fas fa-search"></i>
                    </button>
                </form>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/visual-search}">
                            <i class="fas fa-camera"></i> 以图搜书
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/books/new}">
                            <i class="fas fa-plus"></i> 发布图书
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/books/my-books}">
                            <i class="fas fa-book"></i> 我的图书
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/orders/my}">
                            <i class="fas fa-shopping-cart"></i> 我的订单
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('!isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/login}">
                            <i class="fas fa-sign-in-alt"></i> 登录
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('!isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/register}">
                            <i class="fas fa-user-plus"></i> 注册
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/logout}">
                            <i class="fas fa-sign-out-alt"></i> 退出
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3 th:text="${book.id != null ? '编辑图书' : '发布新图书'}"></h3>
                    </div>
                    <div class="card-body">
                        <form th:action="@{${book.id != null ? '/books/update' : '/books'}}" method="post" enctype="multipart/form-data" th:object="${book}">
                            
                            <!-- 隐藏ID（编辑时使用） -->
                            <input type="hidden" th:field="*{id}" />
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="title" class="form-label">书名 <span style="color: #d73a49;">*</span></label>
                                    <input type="text" class="form-control" id="title" th:field="*{title}" 
                                           placeholder="请输入图书名称" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="author" class="form-label">作者 <span style="color: #d73a49;">*</span></label>
                                    <input type="text" class="form-control" id="author" th:field="*{author}" 
                                           placeholder="请输入作者名称" required>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label for="price" class="form-label">价格（元）<span style="color: #d73a49;">*</span></label>
                                    <input type="number" step="0.01" min="0" class="form-control" id="price" th:field="*{price}" 
                                           placeholder="请输入价格" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="stock" class="form-label">库存数量 <span style="color: #d73a49;">*</span></label>
                                    <input type="number" min="0" class="form-control" id="stock" th:field="*{stock}" 
                                           placeholder="请输入库存数量" required>
                                </div>
                                <div class="col-md-4">
                                    <label for="isbn" class="form-label">ISBN</label>
                                    <input type="text" class="form-control" id="isbn" th:field="*{isbn}" 
                                           placeholder="请输入ISBN编号">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="publisher" class="form-label">出版社</label>
                                <input type="text" class="form-control" id="publisher" th:field="*{publisher}" 
                                       placeholder="请输入出版社名称">
                            </div>
                            
                            <div class="mb-3">
                                <label for="description" class="form-label">图书简介</label>
                                <textarea class="form-control" id="description" th:field="*{description}" 
                                          rows="5" placeholder="请输入图书简介"></textarea>
                                <div class="form-text">简要介绍图书内容，帮助用户了解图书（可选）</div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="coverImage" class="form-label">封面图片 <span style="color: #d73a49;" th:if="${book.id == null}">*</span></label>
                                <input class="form-control" type="file" id="coverImage" name="coverImage" 
                                       accept="image/*" th:if="${book.id == null}" required>
                                <input class="form-control" type="file" id="coverImage" name="coverImage" 
                                       accept="image/*" th:if="${book.id != null}">
                                <div class="form-text">支持JPG、PNG格式，建议尺寸：300x450像素</div>
                                
                                <!-- 图片预览（编辑时显示） -->
                                <img th:if="${book.id != null and book.coverImageUrl != null}" 
                                     th:src="${book.coverImageUrl}" 
                                     class="image-preview" alt="当前封面">
                                <img th:if="${book.id != null and book.coverImageUrl == null}" 
                                     src="/images/default-book.jpg" 
                                     class="image-preview" alt="默认封面">
                            </div>
                            
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary flex-fill">
                                    <i class="fas" th:classappend="${book.id != null ? 'fa-save' : 'fa-plus'}"></i> 
                                    <span th:text="${book.id != null ? '保存修改' : '发布图书'}"></span>
                                </button>
                                <a th:href="@{/my-books}" class="btn btn-secondary flex-fill">
                                    <i class="fas fa-arrow-left"></i> 返回列表
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
