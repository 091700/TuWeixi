<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能图书交易平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .book-card {
            transition: transform 0.2s;
            height: 100%;
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .book-cover {
            height: 300px;
            object-fit: cover;
        }
        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 100px 0;
            margin-bottom: 50px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book"></i> 智能图书平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <form class="d-flex me-auto" th:action="@{/search}" method="get" style="min-width: 300px;">
                    <input class="form-control me-2" type="search" name="keyword" 
                           placeholder="搜索书名、作者..." aria-label="Search">
                    <button class="btn btn-outline-light" type="submit">
                        <i class="fas fa-search"></i>
                    </button>
                </form>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/visual-search}">
                            <i class="fas fa-camera"></i> 以图搜书
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/books/new}">
                            <i class="fas fa-plus"></i> 发布图书
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/books/my-books}">
                            <i class="fas fa-book"></i> 我的图书
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/orders/my}">
                            <i class="fas fa-shopping-cart"></i> 我的订单
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('!isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/login}">
                            <i class="fas fa-sign-in-alt"></i> 登录
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('!isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/register}">
                            <i class="fas fa-user-plus"></i> 注册
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/logout}">
                            <i class="fas fa-sign-out-alt"></i> 退出
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="hero-section text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">欢迎来到最伟大的图书平台</h1>
            <p class="lead">智能图书系统</p>
            <a th:href="@{/visual-search}" class="btn btn-light btn-lg mt-3">
                <i class="fas fa-camera"></i> 以图搜书
            </a>
        </div>
    </div>

    <div class="container">
        <!-- 热门推荐 -->
        <div class="row mb-5">
            <div class="col-md-6">
                <h3><i class="fas fa-fire text-danger"></i> 热门浏览</h3>
                <div class="row">
                    <div class="col-12" th:each="book : ${popularByViews}">
                        <div class="card mb-2">
                            <div class="row g-0">
                                <div class="col-3">
                                    <img th:src="${book.coverImageUrl}" class="img-fluid rounded-start" 
                                         style="height: 80px; object-fit: cover;" alt="Book Cover">
                                </div>
                                <div class="col-9">
                                    <div class="card-body py-2">
                                        <h6 class="card-title" th:text="${book.title}"></h6>
                                        <p class="card-text text-muted small" th:text="${book.author}"></p>
                                        <p class="card-text text-primary fw-bold" th:text="'¥' + ${book.price}"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <h3><i class="fas fa-chart-line text-success"></i> 热销图书</h3>
                <div class="row">
                    <div class="col-12" th:each="book : ${popularByPurchases}">
                        <div class="card mb-2">
                            <div class="row g-0">
                                <div class="col-3">
                                    <img th:src="${book.coverImageUrl}" class="img-fluid rounded-start" 
                                         style="height: 80px; object-fit: cover;" alt="Book Cover">
                                </div>
                                <div class="col-9">
                                    <div class="card-body py-2">
                                        <h6 class="card-title" th:text="${book.title}"></h6>
                                        <p class="card-text text-muted small" th:text="${book.author}"></p>
                                        <p class="card-text text-primary fw-bold" th:text="'¥' + ${book.price}"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="mb-4">最新图书</h2>
        <div class="row">
            <div class="col-md-3 mb-4" th:each="book : ${books.content}">
                <div class="card book-card">
                    <img th:src="${book.coverImageUrl ?: '/images/default-book.jpg'}" 
                         class="card-img-top book-cover" alt="Book Cover">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${book.title}"></h5>
                        <p class="card-text text-muted" th:text="${book.author}"></p>
                        <p class="card-text text-primary fw-bold" th:text="'¥' + ${book.price}"></p>
                        <a th:href="@{'/books/' + ${book.id}}" class="btn btn-outline-primary btn-sm">
                            查看详情
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 分页 -->
        <nav aria-label="Page navigation" th:if="${books.totalPages > 1}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${books.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/(page=${books.number - 1})}">上一页</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, books.totalPages - 1)}" 
                    th:classappend="${i == books.number} ? 'active'">
                    <a class="page-link" th:href="@{/(page=${i})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${books.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/(page=${books.number + 1})}">下一页</a>
                </li>
            </ul>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
