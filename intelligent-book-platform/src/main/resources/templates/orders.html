<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* GitHub 黑绿风格 */
        body {
            background-color: #0d1117;
            color: #c9d1d9;
        }
        .card {
            background-color: #161b22;
            border-color: #30363d;
            margin-bottom: 1rem;
        }
        .card-header {
            background-color: #1f2428;
            border-bottom: 1px solid #30363d;
            color: #ffffff;
        }
        .table {
            color: #c9d1d9;
            margin-bottom: 0;
        }
        .table th {
            color: #ffffff;
            border-bottom: 1px solid #30363d;
        }
        .table td {
            border-bottom: 1px solid #30363d;
            vertical-align: middle;
        }
        .table-hover tbody tr:hover {
            background-color: #21262d;
        }
        /* 订单状态样式 */
        .badge-pending { background-color: #d99000; color: #ffffff; }
        .badge-paid { background-color: #238636; color: #ffffff; }
        .badge-shipped { background-color: #0dcaf0; color: #0d1117; }
        .badge-delivered { background-color: #6f42c1; color: #ffffff; }
        .badge-cancelled { background-color: #d73a49; color: #ffffff; }
        .navbar {
            background-color: #161b22 !important;
            border-bottom: 1px solid #30363d;
        }
        .nav-link { color: #c9d1d9 !important; }
        .nav-link:hover { color: #ffffff !important; }
        footer {
            background-color: #161b22;
            border-top: 1px solid #30363d;
            padding: 1.5rem 0;
            margin-top: 2rem;
        }
        h2 { color: #ffffff !important; margin: 1.5rem 0; }
        .alert-info {
            background-color: #0d1117;
            border-color: #30363d;
            color: #c9d1d9;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book"></i> 智能图书平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <form class="d-flex me-auto" th:action="@{/search}" method="get" style="min-width: 300px;">
                    <input class="form-control me-2" type="search" name="keyword" 
                           placeholder="搜索书名、作者..." aria-label="Search">
                    <button class="btn btn-outline-light" type="submit">
                        <i class="fas fa-search"></i>
                    </button>
                </form>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/visual-search}">
                            <i class="fas fa-camera"></i> 以图搜书
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/books/new}">
                            <i class="fas fa-plus"></i> 发布图书
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/books/my-books}">
                            <i class="fas fa-book"></i> 我的图书
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('isAuthenticated()')}">
                        <a class="nav-link active" th:href="@{/orders/my}">
                            <i class="fas fa-shopping-cart"></i> 我的订单
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('!isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/login}">
                            <i class="fas fa-sign-in-alt"></i> 登录
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('!isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/register}">
                            <i class="fas fa-user-plus"></i> 注册
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/logout}">
                            <i class="fas fa-sign-out-alt"></i> 退出
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2>
            <i class="fas fa-shopping-cart"></i> 我的订单
        </h2>

        <!-- 无订单提示 -->
        <div th:if="${orders == null or orders.isEmpty()}" class="alert alert-info">
            <i class="fas fa-info-circle"></i> 您暂无订单，快去选购图书吧！
        </div>

        <!-- 订单列表 -->
        <div th:if="${orders != null and not orders.isEmpty()}">
            <div class="card" th:each="order : ${orders}">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <div>
                        <strong>订单编号：</strong> <span th:text="${order.id}"></span>
                    </div>
                    <div>
                        <strong>下单时间：</strong> 
                        <!-- 修复时间格式化：使用Thymeleaf安全语法 -->
                        <span th:text="${order.createdAt != null ? #temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm') : ''}"></span>
                    </div>
                </div>
                <div class="card-body">
                    <table class="table">
                        <thead>
                            <tr>
                                <th style="width: 15%;">图书封面</th>
                                <th style="width: 35%;">图书信息</th>
                                <th style="width: 15%;">单价</th>
                                <th style="width: 15%;">数量</th>
                                <th style="width: 20%;">小计</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${order.orderItems}">
                                <!-- 图书封面 -->
                                <td>
                                    <img th:src="${item.book?.coverImageUrl ?: '/images/default-book.jpg'}" 
                                         style="width: 80px; height: 120px; object-fit: cover;" 
                                         alt="Book Cover">
                                </td>
                                <!-- 图书信息 -->
                                <td>
                                    <a th:href="@{'/books/' + ${item.book?.id}}" style="color: #2eaadc; text-decoration: none;">
                                        <span th:text="${item.book?.title}"></span>
                                    </a>
                                    <p class="text-muted small" th:text="${item.book?.author}"></p>
                                </td>
                                <!-- 单价 -->
                                <td th:text="'¥' + ${item.price}"></td>
                                <!-- 数量 -->
                                <td th:text="${item.quantity}"></td>
                                <!-- 小计 -->
                                <td th:text="'¥' + ${item.price * item.quantity}"></td>
                            </tr>
                        </tbody>
                    </table>

                    <!-- 订单汇总 -->
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <div>
                            <!-- 修复订单状态枚举引用：确保全类名正确 -->
                            <span th:switch="${order.status}">
                                <span th:case="${T(com.example.intelligentbookplatform.model.Order.Status).PENDING}" class="badge badge-pending">待支付</span>
                                <span th:case="${T(com.example.intelligentbookplatform.model.Order.Status).PAID}" class="badge badge-paid">已支付</span>
                                <span th:case="${T(com.example.intelligentbookplatform.model.Order.Status).SHIPPED}" class="badge badge-shipped">已发货</span>
                                <span th:case="${T(com.example.intelligentbookplatform.model.Order.Status).DELIVERED}" class="badge badge-delivered">已送达</span>
                                <span th:case="${T(com.example.intelligentbookplatform.model.Order.Status).CANCELLED}" class="badge badge-cancelled">已取消</span>
                            </span>
                        </div>
                        <div>
                            <strong style="color: #ffffff;">订单总额：</strong>
                            <span style="color: #3fb950; font-size: 1.2rem;" th:text="'¥' + ${order.totalPrice}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
