<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .register-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .brand-text {
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="register-container">
            <div class="text-center mb-4">
                <h2><i class="fas fa-book brand-text"></i> 智能图书平台</h2>
                <p class="text-muted">创建账户</p>
            </div>
            <div th:if="${param.error}" class="alert alert-danger">
                <i class="fas fa-exclamation-circle"></i> 注册失败，请检查输入信息！
            </div>

            <form th:action="@{/register}" method="post" th:object="${user}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="username" class="form-label">
                            <i class="fas fa-user"></i> 用户名
                        </label>
                        <input type="text" class="form-control" id="username" 
                               th:field="*{username}" placeholder="请输入用户名" required>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label for="fullName" class="form-label">
                            <i class="fas fa-id-card"></i> 真实姓名
                        </label>
                        <input type="text" class="form-control" id="fullName" 
                               th:field="*{fullName}" placeholder="请输入真实姓名" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope"></i> 邮箱地址
                    </label>
                    <input type="email" class="form-control" id="email" 
                           th:field="*{email}" placeholder="请输入邮箱地址" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i> 密码
                    </label>
                    <input type="password" class="form-control" id="password" 
                           th:field="*{password}" placeholder="请输入密码" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3">
                    <i class="fas fa-user-plus"></i> 注册
                </button>
                
                <div class="text-center">
                    <p class="text-muted">已有账户？ 
                        <a th:href="@{/login}" class="text-decoration-none">立即登录</a>
                    </p>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
