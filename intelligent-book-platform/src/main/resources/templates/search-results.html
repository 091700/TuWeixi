<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索结果</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
        }
        .card {
            background-color: #161b22;
            border-color: #30363d;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
        }
        .btn-outline-primary {
            color: #2eaadc;
            border-color: #2eaadc;
        }
        .btn-outline-primary:hover {
            background-color: #2eaadc;
            color: #0d1117;
        }
        .form-control {
            background-color: #0d1117;
            border-color: #30363d;
            color: #c9d1d9;
        }
        .form-control:focus {
            background-color: #0d1117;
            border-color: #2eaadc;
            box-shadow: 0 0 0 3px rgba(46, 164, 226, 0.3);
            color: #c9d1d9;
        }
        /* 导航栏样式 */
        .navbar {
            background-color: #161b22 !important;
            border-bottom: 1px solid #30363d;
        }
        .nav-link {
            color: #c9d1d9 !important;
        }
        .nav-link:hover {
            color: #ffffff !important;
        }
        /* 页脚样式 */
        footer {
            background-color: #161b22;
            border-top: 1px solid #30363d;
        }
        /* 页面特有样式 */
        h2, h3 {
            color: #ffffff !important;
        }
        .book-cover {
            height: 300px;
            object-fit: cover;
            border-bottom: 1px solid #30363d;
        }
        .highlight {
            color: #3fb950;
            font-weight: bold;
        }
        .search-summary {
            color: #8b949e;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book"></i> 智能图书平台
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <form class="d-flex me-auto" th:action="@{/search}" method="get" style="min-width: 300px;">
                    <input class="form-control me-2" type="search" name="keyword" 
                           th:value="${keyword}" placeholder="搜索书名、作者..." aria-label="Search">
                    <button class="btn btn-outline-light" type="submit">
                        <i class="fas fa-search"></i>
                    </button>
                </form>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/visual-search}">
                            <i class="fas fa-camera"></i> 以图搜书
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/books/new}">
                            <i class="fas fa-plus"></i> 发布图书
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/books/my-books}">
                            <i class="fas fa-book"></i> 我的图书
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/orders/my}">
                            <i class="fas fa-shopping-cart"></i> 我的订单
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('!isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/login}">
                            <i class="fas fa-sign-in-alt"></i> 登录
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('!isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/register}">
                            <i class="fas fa-user-plus"></i> 注册
                        </a>
                    </li>
                    <li class="nav-item" th:if="${#authorization.expression('isAuthenticated()')}">
                        <a class="nav-link" th:href="@{/logout}">
                            <i class="fas fa-sign-out-alt"></i> 退出
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <h2>
                    <i class="fas fa-search"></i> 搜索结果
                </h2>
                <p class="search-summary">
                    为您找到包含 <span class="highlight" th:text="${keyword}"></span> 的图书，共 <span class="highlight" th:text="${results.size()}"></span> 本
                </p>

                <!-- 无结果提示 -->
                <div th:if="${results == null or results.isEmpty()}" class="alert alert-info">
                    <i class="fas fa-info-circle"></i> 未找到与 <span class="highlight" th:text="${keyword}"></span> 相关的图书，请尝试其他关键词
                </div>

                <!-- 搜索结果列表 -->
                <div th:if="${results != null and not results.isEmpty()}" class="row">
                    <div class="col-md-3 mb-4" th:each="book : ${results}">
                        <div class="card h-100 book-card">
                            <img th:src="${book.coverImageUrl ?: '/images/default-book.jpg'}" 
                                 class="card-img-top book-cover" alt="Book Cover">
                            <div class="card-body">
                                <h5 class="card-title" th:text="${book.title}"></h5>
                                <p class="card-text text-muted" th:text="${book.author}"></p>
                                <p class="card-text" style="color: #3fb950; font-weight: bold;" th:text="'¥' + ${book.price}"></p>
                                <a th:href="@{'/books/' + ${book.id}}" class="btn btn-outline-primary btn-sm w-100">
                                    查看详情
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 相关推荐 -->
                <div th:if="${results != null and not results.isEmpty()}" class="row mt-5">
                    <div class="col-12">
                        <h3><i class="fas fa-lightbulb"></i> 猜你喜欢</h3>
                        <div class="row">
                            <div class="col-md-3 mb-4" th:each="book : ${results}">
                                <div class="card h-100 book-card">
                                    <img th:src="${book.coverImageUrl ?: '/images/default-book.jpg'}" 
                                         class="card-img-top book-cover" alt="Book Cover">
                                    <div class="card-body">
                                        <h5 class="card-title" th:text="${book.title}"></h5>
                                        <p class="card-text text-muted" th:text="${book.author}"></p>
                                        <p class="card-text" style="color: #3fb950; font-weight: bold;" th:text="'¥' + ${book.price}"></p>
                                        <a th:href="@{'/books/' + ${book.id}}" class="btn btn-outline-primary btn-sm w-100">
                                            查看详情
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
