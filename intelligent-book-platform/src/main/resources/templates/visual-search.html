<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>以图搜书</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .upload-area:hover {
            border-color: #667eea;
        }
        .upload-area.dragover {
            border-color: #667eea;
            background-color: #f8f9fa;
        }
        .preview-image {
            max-width: 300px;
            max-height: 300px;
            display: none;
        }
        .result-card {
            transition: transform 0.2s;
        }
        .result-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <!-- 导航栏（与首页相同） -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-book"></i> 智能图书平台
            </a>
            <!-- 其他导航项与首页相同 -->
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-12 text-center mb-5">
                <h1><i class="fas fa-camera text-primary"></i> 以图搜书</h1>
                <p class="lead text-muted">上传图书封面图片，智能识别并搜索相关图书</p>
            </div>
        </div>

        <!-- 上传区域 -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                <form th:action="@{/visual-search}" method="post" enctype="multipart/form-data" id="uploadForm">
                    <div class="upload-area mb-3" id="uploadArea">
                        <i class="fas fa-cloud-upload-alt fa-3x text-muted mb-3"></i>
                        <h4>拖放图片到这里或点击上传</h4>
                        <p class="text-muted">支持 JPG, PNG, GIF 格式，最大 10MB</p>
                        <input type="file" class="form-control d-none" id="imageInput" name="image" accept="image/*" required>
                        <button type="button" class="btn btn-primary" onclick="document.getElementById('imageInput').click()">
                            <i class="fas fa-folder-open"></i> 选择图片
                        </button>
                    </div>
                    
                    <!-- 图片预览 -->
                    <div class="text-center mb-3">
                        <img id="imagePreview" src="#" alt="预览图片" class="preview-image rounded shadow">
                    </div>
                    
                    <div class="text-center">
                        <button type="submit" class="btn btn-success btn-lg" id="searchBtn" disabled>
                            <i class="fas fa-search"></i> 开始搜索
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 消息提示 -->
        <div th:if="${message}" class="alert alert-success mt-4" role="alert">
            <i class="fas fa-check-circle"></i> <span th:text="${message}"></span>
        </div>
        
        <div th:if="${error}" class="alert alert-danger mt-4" role="alert">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
        </div>

        <!-- 搜索结果 -->
        <div th:if="${results}" class="row mt-5">
            <div class="col-12">
                <h3 class="mb-4">搜索结果</h3>
                <div class="row">
                    <div class="col-md-4 mb-4" th:each="book : ${results}">
                        <div class="card result-card h-100">
                            <img th:src="${book.coverImageUrl ?: '/images/default-book.jpg'}" 
                                 class="card-img-top" alt="Book Cover" style="height: 200px; object-fit: cover;">
                            <div class="card-body">
                                <h5 class="card-title" th:text="${book.title}"></h5>
                                <p class="card-text text-muted" th:text="${book.author}"></p>
                                <p class="card-text text-primary fw-bold" th:text="'¥' + ${book.price}"></p>
                                <a th:href="@{'/books/' + ${book.id}}" class="btn btn-outline-primary btn-sm">
                                    查看详情
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 功能说明 -->
        <div class="row mt-5">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h4><i class="fas fa-info-circle text-info"></i> 使用说明</h4>
                        <ul class="list-unstyled">
                            <li><i class="fas fa-check text-success"></i> 拍摄或上传清晰的图书封面图片</li>
                            <li><i class="fas fa-check text-success"></i> 系统将自动识别图书信息</li>
                            <li><i class="fas fa-check text-success"></i> 在搜索结果中找到您想要的图书</li>
                            <li><i class="fas fa-check text-success"></i> 支持在线购买和交易</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 图片预览功能
        document.getElementById('imageInput').addEventListener('change', function(event) {
            const [file] = event.target.files;
            if (file) {
                const preview = document.getElementById('imagePreview');
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
                document.getElementById('searchBtn').disabled = false;
            }
        });

        // 拖放功能
        const uploadArea = document.getElementById('uploadArea');
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, unhighlight, false);
        });

        function highlight() {
            uploadArea.classList.add('dragover');
        }

        function unhighlight() {
            uploadArea.classList.remove('dragover');
        }

        uploadArea.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            const input = document.getElementById('imageInput');
            
            if (files.length > 0) {
                input.files = files;
                const event = new Event('change', { bubbles: true });
                input.dispatchEvent(event);
            }
        }

        // 点击上传区域触发文件选择
        uploadArea.addEventListener('click', function() {
            document.getElementById('imageInput').click();
        });
    </script>
</body>
</html>
