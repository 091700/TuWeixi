<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>教师主页 - 学生信息管理</title>
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>
    <div class="header">
        <h1>教师主页（我的班级：<span id="teacherClass"></span>）</h1>
        <div class="user-info">
            <span id="username"></span>
            <button id="logoutBtn">退出登录</button>
        </div>
    </div>

    <!-- 筛选条件 -->
    <div class="filter-container">
        <input type="text" id="studentName" placeholder="学生姓名（模糊搜索）">
        <input type="text" id="studentMajor" placeholder="专业">
        <input type="number" id="minScore" placeholder="最低成绩">
        <input type="number" id="maxScore" placeholder="最高成绩">
        <button id="searchStudentBtn">查询</button>
        <button id="resetStudentBtn">重置</button>
    </div>

    <!-- 操作按钮 -->
    <div class="operate-btn">
        <button id="addStudentBtn">新增学生</button>
        <button id="exportStudentBtn">批量导出</button>
    </div>

    <!-- 学生列表表格 -->
    <table id="studentTable" class="data-table">
        <thead>
            <tr>
                <th>学号</th>
                <th>姓名</th>
                <th>性别</th>
                <th>年龄</th>
                <th>专业</th>
                <th>班级</th>
                <th>成绩</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="studentTableBody">
            <!-- JS动态填充 -->
        </tbody>
    </table>

    <!-- 新增/编辑学生弹窗 -->
    <div id="studentModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h3 id="studentModalTitle">新增学生</h3>
            <form id="studentForm">
                <input type="hidden" id="studentId">
                <div class="form-item">
                    <label for="studentNo">学号：</label>
                    <input type="text" id="studentNo" required>
                </div>
                <div class="form-item">
                    <label for="name">姓名：</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-item">
                    <label for="gender">性别：</label>
                    <select id="gender" required>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="form-item">
                    <label for="age">年龄：</label>
                    <input type="number" id="age" min="15" max="30" required>
                </div>
                <div class="form-item">
                    <label for="major">专业：</label>
                    <input type="text" id="major" required>
                </div>
                <div class="form-item">
                    <label for="className">班级：</label>
                    <input type="text" id="className" readonly required> <!-- 教师新增学生，班级只读 -->
                </div>
                <div class="form-item">
                    <label for="score">成绩：</label>
                    <input type="number" id="score" min="0" max="100" step="0.1" required>
                </div>
                <div class="form-item">
                    <button type="submit">提交</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/teacherIndex.js"></script>
</body>
</html>
